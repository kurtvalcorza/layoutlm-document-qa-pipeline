name: Receipt capstone asset preparation
on:
  push:
    branches: [feat/small-business-receipt-capstone]
    paths: [tools/freeze_receipt_assets.py, tools/receipt-requirements.in, .github/workflows/receipt-assets.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'kurtvalcorza/layoutlm-document-qa-pipeline'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-only tools
        run: python -m pip install uv==0.8.22 pyarrow==21.0.0 pillow==11.3.0
      - name: Hash-lock standalone runtime
        run: uv pip compile tools/receipt-requirements.in --python-version 3.12 --generate-hashes --output-file tools/receipt-requirements.lock
      - name: Verify public source bytes and freeze OCR closure
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/freeze_receipt_assets.py
      - name: Commit only generated manifests and lock on this feature branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          current=$(git ls-remote origin refs/heads/feat/small-business-receipt-capstone | cut -f1)
          test "$current" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/receipt-requirements.lock tutorials/receipt_intelligence/data_manifest.json tutorials/receipt_intelligence/dataset_audit.json tutorials/receipt_intelligence/split_manifest.json tutorials/receipt_intelligence/ocr_manifest.json tutorials/receipt_intelligence/model_manifest.json
          git rm .github/workflows/receipt-assets.yml
          git diff --cached --check
          git commit -m 'Freeze verified receipt source, OCR closure and standalone dependency lock'
          git push origin HEAD:refs/heads/feat/small-business-receipt-capstone
